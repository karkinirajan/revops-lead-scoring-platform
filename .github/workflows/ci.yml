name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Python: API and workers (one uv workspace, one lock file) ----
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the oldest supported (requires-python); 3.14 is what .python-version pins.
        python: ['3.12', '3.14']
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: revops
          POSTGRES_PASSWORD: revops_pass
          POSTGRES_DB: revops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U revops -d revops_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://revops:revops_pass@localhost:5432/revops_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          version: '0.13.7'
          enable-cache: true
      - run: uv sync --locked --all-packages --all-extras --python ${{ matrix.python }}
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy apps/api/app workers
      - name: Tests
        run: uv run --package revops-api pytest apps/api/tests -q --cov=app --cov=workers --cov-report=term-missing:skip-covered
      - name: Dependency audit
        if: matrix.python == '3.14'
        run: uv audit --preview-features audit-command

  # ---- Web ----
  web:
    name: Web (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24', '26']
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Dependency audit (production)
        if: matrix.node == '26'
        run: npm audit --omit=dev --audit-level=high

  # ---- Docker images (built from the repository root; nothing is pushed) ----
  docker:
    name: Docker (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [python, web]
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.service == 'worker' && 'workers/Dockerfile' || format('apps/{0}/Dockerfile', matrix.service) }}
          target: production
          push: false
          tags: revops-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- Gate ----
  all-checks:
    name: All checks passed
    runs-on: ubuntu-latest
    needs: [python, web, docker]
    steps:
      - run: echo "All CI checks passed"
