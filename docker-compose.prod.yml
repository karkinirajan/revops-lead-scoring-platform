# Production stack. Build the images from the repository root first (see the README), then, with the variables below in .env:
#   IMAGE_TAG=<tag> docker compose -f docker-compose.prod.yml up -d
# Required in .env: POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB, REDIS_PASSWORD, and the application secrets listed in .env.example. The application
# refuses to start with APP_ENV=production and placeholder secrets.
# The API is reachable only through nginx, which is why it trusts X-Forwarded-For (see the API image's CMD).

x-python-env: &python-env
  DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/0
  APP_ENV: production

services:
  postgres:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: always
    command: redis-server --appendonly yes --appendfsync everysec --requirepass ${REDIS_PASSWORD} --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migrate:
    image: revops-api:${IMAGE_TAG:-latest}
    restart: "no"
    env_file: .env
    environment:
      <<: *python-env
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    command: alembic -c apps/api/alembic.ini upgrade head

  api:
    image: revops-api:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env
    environment:
      <<: *python-env
    networks:
      - internal
      - egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      rollback_config:
        parallelism: 1
        order: stop-first

  worker:
    image: revops-worker:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env
    environment:
      <<: *python-env
    networks:
      - internal
      - egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 30s

  beat:
    image: revops-worker:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env
    environment:
      <<: *python-env
    networks:
      - internal
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A workers.celery_app beat --loglevel=warning --scheduler celery.beat:PersistentScheduler
    deploy:
      replicas: 1 # only one beat instance may run

  web:
    image: revops-web:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000
    networks:
      - internal
      - frontend

  nginx:
    image: nginx:1.30-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    networks:
      - internal
      - frontend
    depends_on:
      - api
      - web

volumes:
  postgres_data:
  redis_data:

networks:
  # no outside access: the database, Redis and the services that need only them
  internal:
    internal: true
  # outbound access for the services that call CRMs, Jina and the AI provider
  egress:
  frontend:
