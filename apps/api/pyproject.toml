[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revops-api"
version = "0.1.0"
description = "RevOps Lead Scoring Platform — FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg2-binary",
    "pydantic[email]",
    "pydantic-settings",
    "pyjwt",
    "bcrypt",
    "redis",
    "celery",
    "httpx",
    "structlog",
    "slowapi",
    "typer",
    "rich",
    "anthropic",
    "cryptography",
]

[project.optional-dependencies]
# The v2 machine-learning model: training (workers/training) and serving (app/services/ml_scoring_engine.py).
ml = ["xgboost", "scikit-learn", "numpy"]

[project.scripts]
revops = "app.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "faker",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
