worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Security headers (the web app needs inline scripts and styles; everything else is same-origin only)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Hide nginx version
    server_tokens off;

    # Logging (the query string is left out of the log: OAuth codes and tokens can be in it)
    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes_sent":$bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time"}';

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    # Pages and the web app's proxy to the API. Measured on the production build: a full load of /dashboard is 1 document, 11 static files and 15 route
    # prefetches (Next prefetches the sidebar links), so about 16 requests that count here once the static files are exempt (see /_next/static/ below).
    limit_req_zone $binary_remote_addr zone=web:10m rate=120r/m;
    limit_req_status 429;  # "too many requests", not the default 503, which reads as the app being down
    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

    # This nginx is the edge: X-Forwarded-For is set to the address that connected, never appended to what the
    # client sent. The API (uvicorn --proxy-headers) and the web app's BFF read the client address from it, and
    # they use it to rate-limit: with $proxy_add_x_forwarded_for a client could pick its own address per request.
    # Behind a CDN or load balancer, configure real_ip_header / set_real_ip_from for it and use $remote_addr after that.
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    upstream web_backend {
        server web:3000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        client_max_body_size 10m;

        # The API, for other systems (HubSpot's deal webhook, ingestion scripts, API clients). Browsers go through the web app's /bff/ instead.
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass         http://api_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_read_timeout 60s;
        }

        # Health endpoints (no rate limit). /metrics needs an admin login in the API itself.
        location ~ ^/(health|ready|metrics)$ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            access_log off;
        }

        # Signing in: a tighter limit than the rest of the web app
        location = /session/login {
            limit_req zone=login burst=5 nodelay;
            proxy_pass         http://web_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # The web app's proxy to the API (server-sent events must not be buffered)
        location /bff/ {
            limit_req zone=web burst=60 nodelay;
            proxy_pass         http://web_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_buffering    off;
            proxy_read_timeout 120s;
        }

        # The build output: content-hashed, immutable files with no data in them. A page load fetches about a dozen, so they do not count against the page limit.
        location /_next/static/ {
            proxy_pass         http://web_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }

        # Web app (no WebSocket upgrade: the production server has none, only the dev server's hot reload did)
        location / {
            limit_req zone=web burst=60 nodelay;
            proxy_pass         http://web_backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $remote_addr;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
        }
    }
}
