[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "revops-workers"
version = "0.1.0"
description = "RevOps Lead Scoring Platform — Celery workers"
requires-python = ">=3.11"
dependencies = [
    "celery>=5.4.0",
    "redis>=5.2.0",
    "kombu>=5.4.0",
    "structlog>=24.4.0",
    "httpx>=0.28.0",
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.36",
]

[tool.hatch.build.targets.wheel]
packages = ["workers"]
