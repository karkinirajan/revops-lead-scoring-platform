[project]
name = "revops-workers"
version = "0.1.0"
description = "RevOps Lead Scoring Platform — Celery workers"
requires-python = ">=3.12"
dependencies = [
    # the workers import the API package (models, services, settings), so they depend on it as a workspace member
    "revops-api[ml]",
    "boto3",
]

[tool.uv]
# An application run from the repository root (`celery -A workers.celery_app worker`), not an installable package.
package = false

[tool.uv.sources]
revops-api = { workspace = true }
