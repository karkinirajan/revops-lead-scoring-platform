# Local development stack:  docker compose up --build
# Everything is published on 127.0.0.1 only. Flower (task monitor) is started with:  docker compose --profile monitoring up
# Secrets for local use are the placeholders below or come from .env (which is not committed; copy .env.example).

x-python-env: &python-env
  DATABASE_URL: postgresql+psycopg2://revops:${POSTGRES_PASSWORD:-revops_pass}@postgres:5432/revops
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: revops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revops_pass}
      POSTGRES_DB: revops
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18 images keep their data in a versioned folder below /var/lib/postgresql
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revops -d revops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *python-env
      APP_ENV: development
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./workers:/app/workers
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic -c apps/api/alembic.ini upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir apps/api --reload-dir workers"

  worker:
    build:
      context: .
      dockerfile: workers/Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *python-env
      APP_ENV: development
    volumes:
      - ./apps/api:/app/apps/api
      - ./workers:/app/workers
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A workers.celery_app worker --loglevel=info --concurrency=4 -Q ingest,features,scoring,sync,dlq

  beat:
    build:
      context: .
      dockerfile: workers/Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      <<: *python-env
      APP_ENV: development
    volumes:
      - ./apps/api:/app/apps/api
      - ./workers:/app/workers
    depends_on:
      - redis
    command: celery -A workers.celery_app beat --loglevel=info --scheduler celery.beat:PersistentScheduler

  flower:
    image: mher/flower:2.2
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      FLOWER_BASIC_AUTH: ${FLOWER_BASIC_AUTH:?set FLOWER_BASIC_AUTH=user:password to start Flower}
    ports:
      - "127.0.0.1:5555:5555"
    depends_on:
      - redis

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
